<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a17" />
      <stop offset="100%" stop-color="#0e0d0b" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="15" fill="url(#pk-bg)" />
  <!-- Subtle border with vermilion accent tint -->
  <rect width="60" height="60" x="2" y="2" rx="13" fill="none" stroke="#e4472b" stroke-width="1.5" stroke-opacity="0.45" />
  <!-- Bold PK monogram text -->
  <text
    x="28"
    y="43"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="900"
    fill="#FAF8F5"
    text-anchor="middle"
    letter-spacing="-1"
  >PK</text>
  <!-- Vermilion active status dot -->
  <circle cx="49" cy="39" r="3.5" fill="#e4472b" />
</svg>
